# Octop SPK docker-compose.yml
# 由 postinst 复制到 /var/packages/Octop/target/
# 环境变量从 /var/packages/Octop/conf/.env 读取

services:
  octop:
    image: ghcr.io/tencentcloud/octop:latest
    container_name: octop
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Xvnc 需要足够 /dev/shm
    shm_size: "1gb"
    pull_policy: missing
    ports:
      - "${OCTOP_PORT:-8088}:${OCTOP_PORT:-8088}"
    volumes:
      - ${OCTOP_DATA:-/var/packages/Octop/data/.octop}:/data/.octop
    environment:
      - HOME=/data
      - OCTOP_HOME=/data/.octop
      - OCTOP_BIND_HOST=0.0.0.0
      - OCTOP_PORT=${OCTOP_PORT:-8088}
      - OCTOP_LOG_LEVEL=${OCTOP_LOG_LEVEL:-info}
      - OCTOP_DEFAULT_PASSWORD=${OCTOP_DEFAULT_PASSWORD:-}
      - OCTOP_ADMIN_USERNAME=${OCTOP_ADMIN_USERNAME:-admin}
      - OCTOP_ADMIN_DISPLAY_NAME=${OCTOP_ADMIN_DISPLAY_NAME:-Admin}
      - OCTOP_DATABASE_DRIVER=${OCTOP_DATABASE_DRIVER:-}
      - OCTOP_DATABASE_URL=${OCTOP_DATABASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:${OCTOP_PORT:-8088}/api/health', timeout=3)); raise SystemExit(0 if r.get('users_loaded', 0) >= 1 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

